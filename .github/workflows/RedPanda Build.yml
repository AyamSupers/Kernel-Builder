name: Build RedPanda GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "Select build variant"
        required: true
        default: "BakaSU"
        type: choice
        options:
          - BakaSU
          - KernelSU-Next
      clang_choice:
        description: "Select Clang toolchain"
        required: true
        default: "Neutron"
        type: choice
        options:
          - Neutron
      telegram_notify:
        description: 'Send Telegram notification'
        required: true
        type: boolean
        default: true
      telegram_target:
        description: 'Telegram target (Auto = Channel kalau Release, Grup kalau Build)'
        required: false
        default: 'Auto'
        type: choice
        options:
          - Auto
          - Group
          - Channel
      github_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean
      changelogs_url:
        description: 'Changelogs URL (link tombol Changelogs, kosong = commit kernel)'
        required: false
        default: ''
      download_url:
        description: 'Download URL manual (link tombol Download, kosong = auto PixelDrain / GitHub Releases)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TZ: 'Asia/Jakarta'
  KERNEL_REPO: https://${{ secrets.KERNEL_REPO_TOKEN }}@github.com/Artecxyz/RedPanda-kernel.git
  KERNEL_DEFCONFIG: redpanda_defconfig
  KBUILD_BUILD_USER: Artecxyz
  KBUILD_BUILD_HOST: users

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      download_url: ${{ steps.pixeldrain.outputs.url }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 10G
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: Record build start
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV
        
      - name: 🧠 Add swap space (for LTO link)
        run: |
          sudo fallocate -l 16G /mnt/swap_lto || sudo dd if=/dev/zero of=/mnt/swap_lto bs=1M count=16384
          sudo chmod 600 /mnt/swap_lto
          sudo mkswap /mnt/swap_lto
          sudo swapon /mnt/swap_lto
          echo "── swap after ──"; free -h
          
      - name: ⬇️ Clone kernel source
        run: |
          git clone --depth=1 "$KERNEL_REPO" kernel_workspace
          cd kernel_workspace
          KERNEL_VERSION=$(grep '^VERSION =' Makefile | sed 's/.*= //')
          KERNEL_PATCHLEVEL=$(grep '^PATCHLEVEL =' Makefile | sed 's/.*= //')
          KERNEL_SUBLEVEL=$(grep '^SUBLEVEL =' Makefile | sed 's/.*= //')
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "KERNEL_PATCHLEVEL=$KERNEL_PATCHLEVEL" >> $GITHUB_ENV
          echo "KERNEL_SUBLEVEL=$KERNEL_SUBLEVEL" >> $GITHUB_ENV
          echo "KERNEL_VER=$KERNEL_VERSION.$KERNEL_PATCHLEVEL" >> $GITHUB_ENV
          echo "KERNEL_FULL_VERSION=$KERNEL_VERSION.$KERNEL_PATCHLEVEL.$KERNEL_SUBLEVEL" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT_FULL=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      - name: ⚙️ Configure CCache Directory
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          echo "LDCACHE_DIR=$GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}" >> $GITHUB_ENV
          mkdir -p $GITHUB_WORKSPACE/ldcache_${{ env.KERNEL_FULL_VERSION }}

      - name: 💾 Restore APT Cache
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/.apt-pkg-cache
          key: apt-cache-${{ runner.os }}-${{ env.KERNEL_VER }}

      - name: 📦 Install Dependencies
        run: |
          export APT_PACKAGES="python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"
          bash "$GITHUB_WORKSPACE/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache
          
      - name: 💾 Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v6
        with:
          path: toolchains/clang
          key: clang-${{ github.event.inputs.clang_choice }}

      - name: ⬇️ Download & Setup Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/clang && cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: 💾 Restore Cache
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-${{ env.KERNEL_FULL_VERSION }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-

      - name: 💾 Restore ThinLTO Cache
        id: restore-thinlto
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: thinlto-cache-${{ runner.os }}-${{ env.KERNEL_FULL_VERSION }}
          restore-keys: |
            thinlto-cache-${{ runner.os }}-
            
      - name: ⚙️ Initialize Ccache
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "Initializing ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              ccache -o compression=true
              ccache -o compiler_check=none
              ccache -o hash_dir=false
              ccache -o direct_mode=true
              ccache -o depend_mode=false
              ccache -o base_dir="${{ github.workspace }}"
              ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale
              touch "$INIT_FLAG"
              echo "✅ ccache initialization complete"
            else
              echo "✅ ccache already initialized, skipping."
            fi
          else
            echo "❌ ccache not installed, skipping."
          fi

          echo "Initial CCache status:"
          ccache -s

          echo "Updating atime to achieve cache eviction..."
          find "${{ env.CCACHE_DIR }}" -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} + || true

      - name: ⚡ Setup KernelSU
        working-directory: kernel_workspace
        run: |
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "BakaSU" ]; then
            echo "🛠️ Setting up BakaSU (main branch)..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
            cd KernelSU
            KSU_LOCAL_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
            KSU_VERSION_CODE=$((30000 + KSU_LOCAL_VERSION + 700))
            KSU_TAG_NAME=$(git describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
            KSU_UAPI_VERSION=$(grep -oP 'KERNEL_SU_UAPI_VERSION\s*[=,]\s*\K[0-9]+' uapi/supercall.h 2>/dev/null | head -n 1 || true)
            if [ -n "$KSU_UAPI_VERSION" ]; then VARIANT_VERSION_DISPLAY="${KSU_TAG_NAME} (${KSU_VERSION_CODE}/${KSU_UAPI_VERSION})"; else VARIANT_VERSION_DISPLAY="${KSU_TAG_NAME} (${KSU_VERSION_CODE})"; fi
            echo "KSUVER=$KSU_VERSION_CODE" >> $GITHUB_ENV
            echo "KSU_TAG=${KSU_TAG_NAME}" >> $GITHUB_ENV
            echo "VARIANT_VERSION_DISPLAY=${VARIANT_VERSION_DISPLAY}" >> $GITHUB_ENV
            echo "✅ BakaSU ${VARIANT_VERSION_DISPLAY}"

            #MM_PATCH="$GITHUB_WORKSPACE/patches/more_multi_manager.patch"
            #if [ -f "$MM_PATCH" ]; then
            #  patch -p1 -F 3 < "$MM_PATCH"
            #  echo "✅ Add More Multi-Manager List"
            #else
            #  echo "::warning::File Patch not found at $MM_PATCH — skipping"
            #fi
            sed -i 's/-dirty//g' kernel/Kbuild
          elif [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next" ]; then
            echo "🛠️ Setting up KernelSU-Next (dev branch)..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
            cd KernelSU-Next
            KSU_LOCAL_VERSION=$(git rev-list --count HEAD 2>/dev/null || echo 0)
            KSU_VERSION_CODE=$((30000 + KSU_LOCAL_VERSION))
            KSU_TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")
            KSU_UAPI_VERSION=$(grep -oP 'KERNEL_SU_UAPI_VERSION\s*[=,]\s*\K[0-9]+' uapi/supercall.h 2>/dev/null | head -n 1 || true)
            if [ -n "$KSU_UAPI_VERSION" ]; then VARIANT_VERSION_DISPLAY="${KSU_TAG_NAME} (${KSU_VERSION_CODE}/${KSU_UAPI_VERSION})"; else VARIANT_VERSION_DISPLAY="${KSU_TAG_NAME} (${KSU_VERSION_CODE})"; fi
            echo "KSUVER=$KSU_VERSION_CODE" >> $GITHUB_ENV
            echo "KSU_TAG=${KSU_TAG_NAME}" >> $GITHUB_ENV
            echo "VARIANT_VERSION_DISPLAY=${VARIANT_VERSION_DISPLAY}" >> $GITHUB_ENV
            echo "✅ KernelSU-Next ${VARIANT_VERSION_DISPLAY}"
          else
            echo "❌ Unrecognized variant: ${{ github.event.inputs.kernelsu_variant }}"
            exit 1
          fi
          # Tag rilis KSU (mis. v4.2.0 / v3.4.2) untuk baris Variant.
          # Berjalan di dalam dir hasil setup (KernelSU / KernelSU-Next).
          KSU_TAG="$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)"
          echo "KSU_TAG=${KSU_TAG}" >> $GITHUB_ENV
          echo "✅ KSU tag: ${KSU_TAG}"
    
      - name: 🔧 Setup Patches (SUSFS)
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 https://github.com/Artecxyz/susfs4ksu.git -b gki-android15-6.6
          
          cp susfs4ksu/kernel_patches/fs/* ./fs/
          cp susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./
          
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || true
          patch -p1 < 55_selinux_hook_hide_susfs_artifacts.patch || true
          patch -p1 < 56_selinuxfs_hide_sensitive_av.patch || true
          if grep -q "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))" fs/proc/task_mmu.c 2>/dev/null; then
            echo "✅ SUSFS setup complete"
          else
            echo "⚠️  SUS_MAP guard not found — patch may need adjustment"
          fi

      - name: ⚙️ Configure Kernel Options
        working-directory: kernel_workspace
        run: |
          DEFCONFIG="./arch/arm64/configs/$KERNEL_DEFCONFIG"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "ERROR: $DEFCONFIG not found"
            exit 1
          fi

          set_config() {
            local key="$1"
            local value="$2"
            sed -i "/^${key}=/d" "$DEFCONFIG"
            sed -i "/^# ${key} is not set/d" "$DEFCONFIG"
            echo "${key}=${value}" >> "$DEFCONFIG"
          
            if grep -Fxq "${key}=${value}" "$DEFCONFIG"; then
              echo "${key}=${value} (✅ SUCCESS)"
            else
              echo "${key}=${value} (❌ FAILED)" >&2
              return 1
            fi
          }
          
          set_config CONFIG_KSU y
          set_config CONFIG_KALLSYMS y
          set_config CONFIG_KALLSYMS_ALL y
          case "${{ github.event.inputs.kernelsu_variant }}" in
            "KernelSU-Next")
              set_config CONFIG_EXT4_FS y
              ;;
          esac
          
          set_config CONFIG_KSU_SUSFS y
          set_config CONFIG_KSU_SUSFS_SUS_PATH y
          set_config CONFIG_KSU_SUSFS_SUS_MOUNT y
          set_config CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_config CONFIG_KSU_SUSFS_SPOOF_UNAME y
          set_config CONFIG_KSU_SUSFS_ENABLE_LOG y
          set_config CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_config CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_config CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          set_config CONFIG_KSU_SUSFS_SUS_MAP y
          case "${{ github.event.inputs.kernelsu_variant }}" in
            "KernelSU-Next")
              set_config CONFIG_KSU_SUSFS_TRY_UMOUNT y
              ;;
          esac
          
          sed -i 's/check_defconfig//' "$KERNEL_ROOT/build.config.gki" 2>/dev/null || true
          echo "Kernel configs enabled in $KERNEL_DEFCONFIG"
          
      - name: 🔨 Build Kernel
        working-directory: kernel_workspace
        run: |
          export MAP="-fdebug-prefix-map=${GITHUB_WORKSPACE}=. -fmacro-prefix-map=${GITHUB_WORKSPACE}=. -ffile-prefix-map=${GITHUB_WORKSPACE}=."
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"
          export KBUILD_BUILD_USER=$KBUILD_BUILD_USER
          export KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST

          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_IS_KERNEL_COMPILING=true
          
          CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang/bin"
          echo "Clang:  $($CLANG_DIR/clang --version | head -n 1)"
          echo "LLD:    $($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "PAHOLE: $(pahole --version 2>/dev/null)" || echo "PAHOLE: Not Installed"
          
          mkdir -p $GITHUB_WORKSPACE/kout
          mkdir -p "$LDCACHE_DIR"

          echo '#!/bin/bash' > ld-wrapper
          echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(($(nproc --all) / 2))' >> ld-wrapper
          chmod +x ld-wrapper

          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfakestat.so || true
          wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/lib/libfaketimeMT.so || true
          chmod 777 ./*.so || true
          export FAKESTAT="1999-09-09 12:00:00"
          export FAKETIME="@1999-09-09 13:00:00"
          export PRELOAD_LIBS="$(pwd)/libfakestat.so $(pwd)/libfaketimeMT.so"
          
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache gcc" \
            LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option" \
            $KERNEL_DEFCONFIG || { echo "make defconfig failed"; exit 1; }

          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 CC="ccache clang" HOSTCC="ccache gcc" \
            LD="$(pwd)/ld-wrapper" HOSTLD="$(pwd)/ld-wrapper" O=$GITHUB_WORKSPACE/kout \
            KCFLAGS="-pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-default-const-init-var-unsafe -Wno-format -Wno-unknown-warning-option" \
            Image || { echo "make Image failed"; exit 1; }

          echo "Kernel Compilation Complete!"
          ccache -c
          ccache --evict-older-than 10800s
          echo "CCache Status:"
          ccache -s
          df -h

      - name: 📦 Make AnyKernel3
        working-directory: kernel_workspace
        run: |
          git clone --depth=1 https://github.com/Artecxyz/AnyKernel3.git
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp $GITHUB_WORKSPACE/kout/arch/arm64/boot/Image ./Image
          if [ ! -f ./Image ]; then
            echo "Kernel Image not found, build may have failed."
            exit 1
          fi
          gzip -n -f -9 ./Image
          ZIP_NAME=RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}-$(date +%Y%m%d-%H%M).zip
          zip -r9 "../$ZIP_NAME" ./*

      - name: 📨 Stage for Telegram post
        if: github.event.inputs.telegram_notify == 'true'
        env:
          KSU_VARIANT: ${{ github.event.inputs.kernelsu_variant }}
          KSUVER: ${{ env.KSUVER }}
          KERNEL_FULL_VERSION: ${{ env.KERNEL_FULL_VERSION }}
          KERNEL_BRANCH: ${{ env.KERNEL_BRANCH }}
          KERNEL_SOURCE_OWNER: Artecxyz
          KERNEL_SOURCE_REPO: RedPanda-kernel
          CLANG_CHOICE: ${{ github.event.inputs.clang_choice }}
          STAGE_DIR: ${{ github.workspace }}/post-stage
        run: |
          ZIP_PATH="$(ls kernel_workspace/RedPanda-GKI-*.zip | head -n 1)"
          ZIP_NAME="$(basename "$ZIP_PATH")"
          SUSFS_VERSION_TAG="$(grep -E '^#define SUSFS_VERSION[[:space:]]' kernel_workspace/include/linux/susfs.h 2>/dev/null | awk '{print $3}' | tr -d '"' || true)"
          echo "SUSFS version: ${SUSFS_VERSION_TAG:-unknown}"
          ZIP_PATH="$ZIP_PATH" ZIP_NAME="$ZIP_NAME" SUSFS_VERSION_TAG="$SUSFS_VERSION_TAG" bash release/telegram/stage.sh

      - name: 🪞 Mirror to PixelDrain
        id: pixeldrain
        if: github.event.inputs.telegram_notify == 'true'
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url }}
          STAGE_DIR: ${{ github.workspace }}/post-stage
        run: |
          URL="$(bash release/telegram/mirror_pixeldrain.sh | tail -n 1)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload post-stage
        if: github.event.inputs.telegram_notify == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: post-stage
          path: post-stage/*.zip
          if-no-files-found: ignore
          retention-days: 1

      - name: 📤 Upload zip artifact
        if: github.event.inputs.kernelsu_variant != 'none' && github.event.inputs.github_release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}
          path: kernel_workspace/RedPanda-GKI-${{ github.event.inputs.kernelsu_variant }}-*.zip
          retention-days: 7

      - name: 📤 Upload to GitHub Release
        if: github.event.inputs.github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.kernelsu_variant }}-${{ env.KSUVER }}
          name: RedPanda GKI ${{ github.event.inputs.kernelsu_variant }} v${{ env.KSUVER }} - ${{ env.KERNEL_FULL_VERSION }}
          files: kernel_workspace/*.zip

      - name: 📦 Save Cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.kernelsu_variant }}-${{ github.event.inputs.clang_choice }}-${{ env.KERNEL_FULL_VERSION }}

      - name: 📦 Save ThinLTO Cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: thinlto-cache-${{ runner.os }}-${{ env.KERNEL_FULL_VERSION }}

  notify:
    name: Telegram Notify
    runs-on: ubuntu-24.04
    needs: build
    if: github.event.inputs.telegram_notify == 'true' && always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 📥 Download Post Stage
        uses: actions/download-artifact@v8
        with:
          name: post-stage
          path: /tmp/post-stage

      - name: 📨 Send Post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{secrets.MESSAGE_THREAD_ID}}
          TELEGRAM_API_BASE: https://api.telegram.org
          TELEGRAM_TARGET: ${{ github.event.inputs.telegram_target }}
          CHANGELOG_URL: ${{ github.event.inputs.changelogs_url }}
          DOWNLOAD_URL: ${{ needs.build.outputs.download_url }}
        run: bash release/telegram/post.sh

      - name: 👤 Send via akun pribadi (channel 2)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNEL_2: ${{ secrets.CHANNEL_2 }}
          DOWNLOAD_URL: ${{ needs.build.outputs.download_url }}
          CHANGELOG_URL: ${{ github.event.inputs.changelogs_url }}
          STAGE_DIR: /tmp/post-stage
        run: |
          pip install -q telethon
          python3 release/telegram/post_user.py
